<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الوطنية للمنح الدولية | جاري التحميل</title>
    <!-- استدعاء Tailwind CSS و FontAwesome CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 1. استدعاء الخط العربي 'Hana' المرفوع في مستودعك */
        @font-face {
            font-family: 'HanaFont';
            src: url('hana.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* 2. استدعاء الخط اللاتيني المرفوع في مستودعك */
        @font-face {
            font-family: 'TheSansFont';
            src: url('TheSans-Plain.otf (1).ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* تطبيق الخطوط والألوان */
        body {
            background-color: #ffffff;
            overflow: hidden; /* لمنع التمرير أثناء التحميل */
        }

        /* تخصيص خط Hana العربي */
        .font-hana {
            font-family: 'HanaFont', sans-serif !important;
        }

        /* تخصيص خط TheSans اللاتيني */
        .font-thesans {
            font-family: 'TheSansFont', sans-serif !important;
        }

        /* 3. تصميم أنيق ودقيق لمؤشر التحميل بألوان العلم الوطني */
        .dz-spinner {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            /* اللون الرمادي الفاتح للخلفية كقاعدة كلاسيكية */
            border: 4px solid #f3f3f3;
            /* ترتيب ذكي للألوان الثلاثة (الأخضر، الأبيض، الأحمر) */
            border-top: 4px solid #006233; /* الأخضر الجزائري الرسمي */
            border-right: 4px solid #d21034; /* الأحمر الجزائري الرسمي */
            border-bottom: 4px solid #006233; /* الأخضر الجزائري الرسمي */
            /* الأبيض الجزائري الرسمي */
            border-left: 4px solid transparent; /* لجعل اللون الأبيض يظهر عبر الفراغ */

            /* تفعيل الحركة الدائرية بسرعة متوسطة */
            animation: spin-dz 1s linear infinite;
        }

        /* تخصيص اللون الأبيض للعلامة */
        .dz-spinner::after {
          content: "";
          position: absolute;
          top: -4px;
          left: -4px;
          right: -4px;
          bottom: -4px;
          border-radius: 50%;
          border: 4px solid transparent;
          border-left-color: #ffffff;
          animation: spin-dz 1s linear infinite;
        }

        /* تعريف حركة الدوران بسرعة متوسطة وانسيابية */
        @keyframes spin-dz {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* تأثير التلاشي (Fade Out) بعد انتهاء التحميل */
        .preloader-fade-out {
            opacity: 0;
            visibility: hidden;
            transition: all 1s ease-out; /* حركة انسيابية لمدة ثانية */
        }
    </style>
</head>
<body>

    <!-- قسم واجهة التحميل (SplashScreen) -->
    <div id="preloader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white">
        
        <!-- حاوية المؤشر والشعار -->
        <div class="relative flex flex-col items-center">
            
            <!-- مؤشر التحميل بألوان العلم الوطني الثلاثة والدوران السريع -->
            <div class="dz-spinner mb-12"></div>
            
            <!-- النص الكلاسيكي باللون الأسود وخط Hana -->
            <p class="font-hana text-3xl font-extrabold text-black leading-tight">
                جاري التحميل
            </p>
            
            <!-- إضافة لمسة كلاسيكية إضافية (أزرار اللغة المحايدة) -->
            <div class="mt-20 flex gap-6 text-sm font-thesans text-slate-500">
                <span>Français</span>
                <span class="text-slate-300">|</span>
                <span>English</span>
            </div>
        </div>

    </div>

    <!-- كود JavaScript لتفعيل مدة الـ 3 ثواني وتحويل الواجهة -->
    <script>
        // دالة لإخفاء واجهة التحميل بعد 3 ثواني
        window.addEventListener('load', function() {
            // انتظر 3000 ميلي ثانية (3 ثواني)
            setTimeout(function() {
                const preloader = document.getElementById('preloader');
                // إضافة تأثير التلاشي
                preloader.classList.add('preloader-fade-out');
                
                // السماح بالتمرير بعد اختفاء الواجهة
                document.body.style.overflow = 'auto';

                // إشعار جاهزية الموقع لبدء الأقسام التالية
                console.log("الموقع جاهز الآن لبناء باقي الأقسام!");
            }, 3000); 
        });
    </script>

</body>
</html>
